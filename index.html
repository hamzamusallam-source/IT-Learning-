<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza IT Learning | Technology Knowledge Hub</title>
<script src="https://unpkg.com"></script>
<style>
:root { --red: #C74634; --dark: #252525; --bg: #F5F6F8; --border: #E4E7EC; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--dark); line-height: 1.6; }
header { height: 78px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 7%; position: sticky; top: 0; z-index: 1000; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; text-decoration: none; color: inherit; }
.brand b { color: var(--red); }
nav { display: flex; gap: 30px; align-items: center; }
nav a { color: #424B56; font-size: 14px; font-weight: 600; text-decoration: none; }
.hero { min-height: 510px; display: flex; align-items: center; padding: 90px 7%; background: linear-gradient(120deg, #FFFFFF, #F3F5F8); }
.hero h1 { font-size: clamp(40px, 5.5vw, 66px); margin: 23px 0; color: #252525; }
.hero h1 span { color: var(--red); }
.btn { display: inline-block; background: var(--red); color: white; padding: 14px 28px; border-radius: 5px; font-weight: bold; text-decoration: none; }
.courses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 80px 7%; }
.course { background: white; padding: 28px; border: 1px solid var(--border); border-radius: 10px; }
.search { max-width: 570px; margin: 0 auto 40px; padding: 0 7%; }
.search input { width: 100%; height: 54px; border: 1px solid #D9DEE5; border-radius: 7px; padding: 0 20px; outline: none; }
@media(max-width: 950px) { .courses { grid-template-columns: repeat(2, 1fr); } }
@media(max-width: 650px) { .courses { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><span>Hamza <b>IT Learning</b></span></a>
  <nav id="nav">
    <a href="#home">Home</a>
    <a href="#courses">Learning Paths</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>
<main>
  <section class="hero" id="home">
    <div>
      <h1>Upgrade Your Skills.<br>Build Your <span>Future.</span></h1>
      <a href="#courses" class="btn">Explore Courses</a>
    </div>
  </section>
  <section id="courses">
    <div class="search">
      <input type="text" id="searchInput" onkeyup="filterCourses()" placeholder="Search learning paths...">
    </div>
    <div class="courses" id="coursesGrid">
      <div class="course"><h3>Networking</h3><p>DNS, DHCP, VLAN, Routing, NAT, VPN...</p></div>
      <div class="course"><h3>Cloud Computing</h3><p>IaaS, PaaS, SaaS, scalability...</p></div>
      <div class="course"><h3>Cybersecurity</h3><p>Identity, Zero Trust, firewalls...</p></div>
    </div>
  </section>
</main>
<script>
  lucide.createIcons();
  function filterCourses() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.course').forEach(card => {
      card.style.display = card.innerText.toLowerCase().includes(input) ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
